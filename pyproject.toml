[project]
name = "tripwire"
version = "0.1.0"
description = "Red-team eval for Inkbox agents woken by signed GitHub webhooks"
requires-python = ">=3.12"
dependencies = ["anthropic>=0.40", "aiohttp>=3.9"]

[project.optional-dependencies]
live = ["inkbox"]
sdk = [
    "claude-agent-sdk>=0.2.182",
]

[project.scripts]
tripwire = "tripwire.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 110
